name: afrigo_app
description: "Pan-African Digital Trade Operating System - Mobile & Web App"

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Navigation
  go_router: ^12.0.0
  
  # HTTP Client
  dio: ^5.3.0
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  firebase_database: ^10.4.0
  firebase_messaging: ^14.6.0
  
  # Social Authentication
  google_sign_in: ^6.1.0
  flutter_facebook_auth: ^6.0.0
  # sign_in_with_apple: ^5.0.0  # Disabled due to Android compatibility issues
  
  # Local Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  
  # Forms & Validation
  formz: ^0.6.0
  
  # Utils
  intl: ^0.18.0
  uuid: ^4.0.0
  logger: ^2.0.0
  
  # UI helpers
  shimmer: ^3.0.0
  animations: ^2.0.0
  
  # Lot Management & Photo Upload
  image_picker: ^1.0.0
  qr_flutter: ^4.1.0
  google_maps_flutter: ^2.5.0
  
  # Contract Signing
  hand_signature: ^3.1.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true

