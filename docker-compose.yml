version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: afrigo_postgres_dev
    environment:
      POSTGRES_USER: afrigo_dev
      POSTGRES_PASSWORD: dev_password_123  # Change in production!
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./migrations/001-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afrigo_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afrigo_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: afrigo_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@afrigo.local
      PGADMIN_DEFAULT_PASSWORD: admin_password_123  # Change in production!
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - afrigo_network

volumes:
  postgres_data:

networks:
  afrigo_network:
    driver: bridge
